<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
</head>
<body>
  <h2>Real-Time Chat</h2>

<div id="login">
  <input id="username" placeholder="Enter username" />
  <input id="room" placeholder="Enter room name" />
  <button onclick="joinChat()">Join</button>
</div>


  <div id="chat" style="display:none;">
    <div style="display:flex; gap:40px;">
  
        <div>
            <h3>Messages</h3>
            <ul id="messages"></ul>
            <p id="typing" style="color: gray;"></p>

        </div>

        <div>
            <h3>Active Users</h3>
            <ul id="users"></ul>
        </div>

    </div>
    <input id="message" placeholder="Type message..." oninput="sendTyping()" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = "";
    let room = "";

    function joinChat() {
    username = document.getElementById("username").value;
    room = document.getElementById("room").value;

    if (!username || !room) return alert("Enter username and room");

    socket.emit("join-room", { username, room });

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
}
    function sendTyping() {
    socket.emit("typing");
  }



  function sendMessage() {
    const input = document.getElementById("message");
    const msg = input.value.trim();
    if (!msg) return;

    if (msg.startsWith("@")) {
      const spaceIndex = msg.indexOf(" ");
      if (spaceIndex === -1) return alert("Invalid private message format");

      const targetUser = msg.substring(1, spaceIndex);
      const privateMsg = msg.substring(spaceIndex + 1);

      socket.emit("private-message", {
        to: targetUser,
        message: privateMsg
      });
    } else {
      socket.emit("chat-message", msg);
    }

    input.value = "";
  }

    socket.on("typing", (username) => {
      const typing = document.getElementById("typing");
      typing.textContent = `${username} is typing...`;

      setTimeout(() => {
        typing.textContent = "";
      }, 1000);
    });

    socket.on("chat-history", (messages) => {
      const messagesList = document.getElementById("messages");
      messagesList.innerHTML = "";

      messages.forEach(data => {
        const li = document.createElement("li");
        li.textContent = `[${data.time}] ${data.user}: ${data.message}`;
        messagesList.appendChild(li);
      });
    });




    socket.on("chat-message", (data) => {
      const li = document.createElement("li");
      li.textContent = `[${data.time}] ${data.user}: ${data.message}`;
      document.getElementById("messages").appendChild(li);
    });
    
    socket.on("private-message", (data) => {
      const li = document.createElement("li");
      li.textContent = `[${data.time}] (Private) ${data.from}: ${data.message}`;
      li.style.color = "purple";
      document.getElementById("messages").appendChild(li);
    });


    socket.on("system-message", (msg) => {
      const li = document.createElement("li");
      li.textContent = msg;
      li.style.color = "gray";
      document.getElementById("messages").appendChild(li);
    });
    socket.on("room-users", (users) => {
        const usersList = document.getElementById("users");
        usersList.innerHTML = "";

        users.forEach(user => {
            const li = document.createElement("li");
            li.textContent = user;
            usersList.appendChild(li);
        });
        });

  </script>
</body>

</html>
